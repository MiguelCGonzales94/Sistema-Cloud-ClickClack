modules:
  # URL pública: el certificado se valida de verdad (cadena y nombre).
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4

  # Sonda directa a la IP privada de un nodo: el certificado es del dominio y no de la IP.
  http_2xx_sin_verificar:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true
