# Exportadores de métricas de un NODO (nodo 1 o nodo 2). Se ejecuta desde infra/ con:
#   IP_NODO=10.0.0.4 sudo -E docker compose -f monitoreo/exportadores.yml --env-file .env up -d
# Todo se publica SOLO en la IP privada del nodo: Internet no llega (el balanceador solo reenvía
# 80/443/8443) y el NSG no abre estos puertos.
#
#   9100  node-exporter     CPU, memoria, disco y red de la VM
#   8081  cAdvisor          uso de CPU/memoria por contenedor
#   9187  postgres_exporter estado de PostgreSQL y de la replicación (rol `monitoreo`, solo pg_monitor)
name: clickclak-exportadores

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host            # para ver las interfaces reales de la VM
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=${IP_NODO:?Falta IP_NODO}:9100
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    ports:
      - "${IP_NODO:?Falta IP_NODO}:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 128m

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      # Rol `monitoreo` (lo crea preparar-primaria.sh): solo pg_monitor, sin permisos de escritura.
      DATA_SOURCE_NAME: postgresql://monitoreo:${METRICAS_CLAVE:?Falta METRICAS_CLAVE en infra/.env}@postgres:5432/clickclak?sslmode=disable
    ports:
      - "${IP_NODO:?Falta IP_NODO}:9187:9187"
    networks: [datos]
    mem_limit: 64m

networks:
  datos:
    external: true
    name: clickclak_datos
