# Observabilidad del TESTIGO (tercer servidor). Se ejecuta en la VM del testigo, desde monitoreo/:
#   sudo docker compose -f docker-compose.testigo.yml up -d
#
# Corre FUERA de los nodos a propósito: si un nodo cae, el tablero y las alertas siguen vivos y
# muestran la caída (el monitoreo no comparte dominio de falla con lo que vigila).
# Todo se publica solo en la IP privada del testigo; Grafana se abre por túnel SSH.
name: clickclak-testigo

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "10.0.0.6:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - ./secretos/metricas_clave:/etc/prometheus/secretos/metricas_clave:ro
      - prometheus_data:/prometheus
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "10.0.0.6:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    mem_limit: 64m

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 64m

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_clave
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/clickclak.json
    ports:
      - "10.0.0.6:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./secretos/grafana_clave:/run/secrets/grafana_clave:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    mem_limit: 256m

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=10.0.0.6:9100
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
